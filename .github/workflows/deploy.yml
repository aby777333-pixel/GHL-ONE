name: Deploy to Netlify
on:
  push:
    branches: [main]
  workflow_dispatch: {}
concurrency:
  group: netlify-prod
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      # Build-time public config (inlined into the client bundle). Runtime secrets stay in Netlify's environment.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build (Netlify build, offline — no API calls)
        run: npx --yes netlify-cli@24 build --offline --context production
      - name: Deploy prebuilt output
        run: |
          set -euo pipefail
          npx --yes netlify-cli@24 deploy --prod --no-build --message "push: ${GITHUB_SHA:0:7}" --debug 2>&1 | tail -40
