<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · GHL ONE</title>
    <link rel="icon" href="/icon.svg" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font: 400 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
        background: #f6f7f9;
        color: #0b0f17;
      }
      .box { max-width: 380px; width: 100%; text-align: center; }
      .mark {
        width: 56px; height: 56px; margin: 0 auto 18px;
        border-radius: 16px;
        background: linear-gradient(135deg, #1e3a8a, #7c3aed);
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-weight: 700; letter-spacing: .5px; font-size: 15px;
      }
      h1 { font-size: 19px; font-weight: 600; margin: 0 0 8px; }
      p { margin: 0 0 20px; opacity: .7; font-size: 14px; }
      button {
        font: inherit; font-weight: 500;
        padding: 10px 20px; border-radius: 10px; border: 0; cursor: pointer;
        background: #1e3a8a; color: #fff;
      }
      button:active { transform: scale(.98); }
      @media (prefers-color-scheme: dark) {
        body { background: #0b0f17; color: #e8eaed; }
        button { background: #60a5fa; color: #0b0f17; }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="mark">GHL</div>
      <h1>You are offline</h1>
      <p>
        GHL ONE is a live workspace, so it needs a connection to show you anything real.
        Nothing you were doing has been lost.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
